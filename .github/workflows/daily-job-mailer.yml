name: Daily job mailer

on:
  schedule:
    # Once a day at 12:07 PM IST (= 06:37 UTC; cron times are always UTC).
    # GitHub often starts scheduled runs hours late, worst at the top of the hour, so this avoids :00.
    - cron: "37 6 * * *"
  workflow_dispatch:

# Never run two digests at the same time (e.g. manual run + schedule).
concurrency:
  group: daily-job-mailer
  cancel-in-progress: false

jobs:
  send-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --omit=dev

      # Remembers jobs that were already emailed, so every digest only contains new posts.
      # A new cache entry is saved after each successful run; the newest one is restored.
      - name: Restore seen jobs
        uses: actions/cache@v4
        with:
          path: .cache
          key: seen-jobs-${{ github.run_id }}
          restore-keys: seen-jobs-

      - name: Send daily digest
        run: npm start
        env:
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          SEARCH_KEYWORDS: ${{ vars.SEARCH_KEYWORDS }}
          SEARCH_LOCATIONS: ${{ vars.SEARCH_LOCATIONS }}
          EXCLUDE_KEYWORDS: ${{ vars.EXCLUDE_KEYWORDS }}
          SERPAPI_KEYWORDS: ${{ vars.SERPAPI_KEYWORDS }}
          SERPAPI_DAILY_SEARCHES: ${{ vars.SERPAPI_DAILY_SEARCHES }}
          MAX_EXPERIENCE_YEARS: ${{ vars.MAX_EXPERIENCE_YEARS }}
          OFFCAMPUS_JOBS: ${{ vars.OFFCAMPUS_JOBS }}
          SEND_EMPTY_DIGEST: ${{ vars.SEND_EMPTY_DIGEST }}
          MAX_RESULTS: ${{ vars.MAX_RESULTS }}
          FRESH_HOURS: ${{ vars.FRESH_HOURS }}
          INCLUDE_UNKNOWN_DATES: ${{ vars.INCLUDE_UNKNOWN_DATES }}
          DRY_RUN: ${{ vars.DRY_RUN }}
